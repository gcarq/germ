[package]
name = "package-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
regex = { version = "1.12.2", default-features = false, features = ["perf", "std"] }
lazy_static = { version = "1.5.0", default-features = false }
colored = { version = "3.0.0", default-features = false }
anyhow = { version = "1.0.100", default-features = false, features = ["std"] }
rust-ini = { version = "0.21.3", default-features = false }
shlex = { version = "1.3.0", default-features = false, features = ["std"] }
clap = { version = "4.5.54", default-features = false, features = ["color", "error-context", "help", "std", "usage", "derive"] }
constcat = { version = "0.6.1", default-features = false }
nix = { version = "0.31.1", default-features = false, features = ["process", "signal", "poll", "fs"] }
strum = { version = "0.27.2", default-features = false, features = ["std", "derive"] }


[profile.release]
opt-level = 3
debug = false
strip = true
lto = true
panic = 'unwind'
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = false