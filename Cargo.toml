[workspace]
members = ["crates/cli", "crates/core"]
default-members = ["crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"

[workspace.dependencies]
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
clap = { version = "4.6.2", default-features = false, features = ["color", "error-context", "help", "std", "usage", "derive"] }
colored = { version = "3.1.1", default-features = false }
constcat = { version = "0.6.1", default-features = false }
either = { version = "1.17.0", default-features = false, features = ["std"] }
fern = { version = "0.7.1", default-features = false }
fxhash = { version = "0.2.1", default-features = false }
log = { version = "0.4.33", default-features = false }
md-5 = { version = "0.11.0", default-features = false }
nix = { version = "0.31.3", default-features = false, features = ["fs", "process", "signal"] }
germ-core = { path = "crates/core" }
redb = { version = "4.1.0", default-features = false }
rayon = { version = "1.12.0", default-features = false }
regex = { version = "1.13.1", default-features = false, features = ["perf", "std"] }
rkyv = { version = "0.8.17", default-features = false, features = ["bytecheck", "std", "unaligned"] }
rust-ini = { version = "0.21.3", default-features = false }
shlex = { version = "2.0.1", default-features = false, features = ["std"] }
tempfile = { version = "3.27.0", default-features = false }
thiserror = { version = "2.0.19", default-features = false, features = ["std"] }
walkdir = { version = "2.5.0", default-features = false }

[workspace.lints.clippy]
dbg_macro = "warn"
disallowed_script_idents = "warn"
doc_link_with_quotes = "warn"
empty_structs_with_brackets = "warn"
filter_map_next = "warn"
format_collect = "warn"
from_iter_instead_of_collect = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
missing_const_for_fn = "warn"
missing_panics_doc = "warn"
non_std_lazy_statics = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
similar_names = "warn"
single_match_else = "warn"
too_many_lines = "warn"
uninlined_format_args = "warn"
unnecessary_wraps = "warn"
unused_self = "warn"
use_debug = "warn"
used_underscore_binding = "warn"
useless_let_if_seq = "warn"
wildcard_dependencies = "warn"
wildcard_imports = "warn"

[profile.release]
opt-level = 3
debug = false
strip = true
lto = true
panic = 'unwind'
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = false
